services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: lip
      POSTGRES_USER: lip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lip"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      OCI_AUTH_MODE: ${OCI_AUTH_MODE:-instance_principal}
      OCI_TENANCY_OCID: ${OCI_TENANCY_OCID:-ocid1.tenancy.oc1..aaaaaaaa5trur7whdyytam4nmh3tinrx2yfqnbss6yzz4q6i7gmm2leagnkq}
      OCI_DEFAULT_REGION: ${OCI_DEFAULT_REGION:-us-ashburn-1}
      OCI_CONNECT_TIMEOUT_SECONDS: ${OCI_CONNECT_TIMEOUT_SECONDS:-10}
      OCI_READ_TIMEOUT_SECONDS: ${OCI_READ_TIMEOUT_SECONDS:-45}
      OCI_MAX_SERVICE_WORKERS: ${OCI_MAX_SERVICE_WORKERS:-6}
      OCI_MAX_LIMIT_WORKERS: ${OCI_MAX_LIMIT_WORKERS:-10}
      OCI_MAX_REGION_WORKERS: ${OCI_MAX_REGION_WORKERS:-2}
      OCI_GLOBAL_MAX_CONCURRENT_REQUESTS: ${OCI_GLOBAL_MAX_CONCURRENT_REQUESTS:-12}
      OCI_DB_COMMIT_BATCH_SIZE: ${OCI_DB_COMMIT_BATCH_SIZE:-25}
      OCI_REGION_STAGGER_SECONDS: ${OCI_REGION_STAGGER_SECONDS:-15}
      OCI_REGION_SCAN_MAX_ATTEMPTS: ${OCI_REGION_SCAN_MAX_ATTEMPTS:-3}
      OCI_REGION_RETRY_BASE_SECONDS: ${OCI_REGION_RETRY_BASE_SECONDS:-30}
      OCI_REGION_RETRY_MAX_SECONDS: ${OCI_REGION_RETRY_MAX_SECONDS:-300}
      LIP_ENABLE_NOTIFICATIONS: ${LIP_ENABLE_NOTIFICATIONS:-false}
      LIP_NOTIFICATION_EMAILS: ${LIP_NOTIFICATION_EMAILS:-["grant.frost@oracle.com"]}
      LIP_SCAN_INTERVAL_MINUTES: ${LIP_SCAN_INTERVAL_MINUTES:-240}
      LIP_PROMETHEUS_OTLP_ENDPOINT: ${LIP_PROMETHEUS_OTLP_ENDPOINT:-http://prometheus:9090/api/v1/otlp/v1/metrics}
      LIP_METRICS_PUBLISH_MAX_ATTEMPTS: ${LIP_METRICS_PUBLISH_MAX_ATTEMPTS:-3}
      LIP_METRICS_PUBLISH_TIMEOUT_SECONDS: ${LIP_METRICS_PUBLISH_TIMEOUT_SECONDS:-30}
      UPLOAD_DIR: /var/lib/oci-lip/uploads
    volumes:
      - uploads:/var/lib/oci-lip/uploads
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.worker"]
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      OCI_AUTH_MODE: ${OCI_AUTH_MODE:-instance_principal}
      OCI_TENANCY_OCID: ${OCI_TENANCY_OCID:-ocid1.tenancy.oc1..aaaaaaaa5trur7whdyytam4nmh3tinrx2yfqnbss6yzz4q6i7gmm2leagnkq}
      OCI_DEFAULT_REGION: ${OCI_DEFAULT_REGION:-us-ashburn-1}
      OCI_SCAN_ALL_REGIONS: ${OCI_SCAN_ALL_REGIONS:-false}
      OCI_CONNECT_TIMEOUT_SECONDS: ${OCI_CONNECT_TIMEOUT_SECONDS:-10}
      OCI_READ_TIMEOUT_SECONDS: ${OCI_READ_TIMEOUT_SECONDS:-45}
      OCI_MAX_SERVICE_WORKERS: ${OCI_MAX_SERVICE_WORKERS:-6}
      OCI_MAX_LIMIT_WORKERS: ${OCI_MAX_LIMIT_WORKERS:-10}
      OCI_MAX_REGION_WORKERS: ${OCI_MAX_REGION_WORKERS:-2}
      OCI_GLOBAL_MAX_CONCURRENT_REQUESTS: ${OCI_GLOBAL_MAX_CONCURRENT_REQUESTS:-12}
      OCI_DB_COMMIT_BATCH_SIZE: ${OCI_DB_COMMIT_BATCH_SIZE:-25}
      OCI_REGION_STAGGER_SECONDS: ${OCI_REGION_STAGGER_SECONDS:-15}
      OCI_REGION_SCAN_MAX_ATTEMPTS: ${OCI_REGION_SCAN_MAX_ATTEMPTS:-3}
      OCI_REGION_RETRY_BASE_SECONDS: ${OCI_REGION_RETRY_BASE_SECONDS:-30}
      OCI_REGION_RETRY_MAX_SECONDS: ${OCI_REGION_RETRY_MAX_SECONDS:-300}
      LIP_SCAN_INTERVAL_MINUTES: ${LIP_SCAN_INTERVAL_MINUTES:-240}
      LIP_WORKER_POLL_SECONDS: ${LIP_WORKER_POLL_SECONDS:-2}
      LIP_PROMETHEUS_OTLP_ENDPOINT: ${LIP_PROMETHEUS_OTLP_ENDPOINT:-http://prometheus:9090/api/v1/otlp/v1/metrics}
      LIP_METRICS_PUBLISH_MAX_ATTEMPTS: ${LIP_METRICS_PUBLISH_MAX_ATTEMPTS:-3}
      LIP_METRICS_PUBLISH_TIMEOUT_SECONDS: ${LIP_METRICS_PUBLISH_TIMEOUT_SECONDS:-30}
      LIP_ENABLE_NOTIFICATIONS: ${LIP_ENABLE_NOTIFICATIONS:-false}
      LIP_NOTIFICATION_EMAILS: ${LIP_NOTIFICATION_EMAILS:-["grant.frost@oracle.com"]}
      UPLOAD_DIR: /var/lib/oci-lip/uploads
    volumes:
      - uploads:/var/lib/oci-lip/uploads
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.12.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=5GB
      - --web.enable-lifecycle
      - --web.enable-otlp-receiver
      - --query.lookback-delta=30d
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana-enterprise:13.0.2
    environment:
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://129.80.114.109/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_NAME: Main Org.
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/oci-lip-overview.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    depends_on:
      - api
      - grafana
    ports:
      - "80:80"

volumes:
  postgres-data:
  uploads:
  prometheus-data:
  grafana-data:

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    stop_grace_period: 1m
    logging: *default-logging
    environment:
      POSTGRES_DB: lip
      POSTGRES_USER: lip
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lip"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    init: true
    restart: unless-stopped
    stop_grace_period: 1m
    logging: *default-logging
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-[]}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      AUTH_PUBLIC_URL: ${AUTH_PUBLIC_URL:-http://localhost}
      AUTH_SESSION_SECRET: ${AUTH_SESSION_SECRET:-local-development-session-secret}
      AUTH_SESSION_MAX_AGE_SECONDS: ${AUTH_SESSION_MAX_AGE_SECONDS:-28800}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_OIDC_DISCOVERY_URL: ${AUTH_OIDC_DISCOVERY_URL:-}
      AUTH_OIDC_CLIENT_ID: ${AUTH_OIDC_CLIENT_ID:-}
      AUTH_OIDC_CLIENT_SECRET: ${AUTH_OIDC_CLIENT_SECRET:-}
      AUTH_OIDC_SCOPES: ${AUTH_OIDC_SCOPES:-openid profile email groups}
      AUTH_GROUP_CLAIM: ${AUTH_GROUP_CLAIM:-groups}
      AUTH_VIEWER_GROUPS: ${AUTH_VIEWER_GROUPS:-["OCI-LIP-Viewers"]}
      AUTH_OPERATOR_GROUPS: ${AUTH_OPERATOR_GROUPS:-["OCI-LIP-Operators"]}
      AUTH_ADMIN_GROUPS: ${AUTH_ADMIN_GROUPS:-["OCI-LIP-Admins"]}
      AUTH_BOOTSTRAP_ADMIN_EMAILS: ${AUTH_BOOTSTRAP_ADMIN_EMAILS:-[]}
      OCI_AUTH_MODE: ${OCI_AUTH_MODE:-instance_principal}
      OCI_TENANCY_OCID: ${OCI_TENANCY_OCID:-ocid1.tenancy.oc1..aaaaaaaa5trur7whdyytam4nmh3tinrx2yfqnbss6yzz4q6i7gmm2leagnkq}
      OCI_DEFAULT_REGION: ${OCI_DEFAULT_REGION:-us-ashburn-1}
      OCI_CONNECT_TIMEOUT_SECONDS: ${OCI_CONNECT_TIMEOUT_SECONDS:-10}
      OCI_READ_TIMEOUT_SECONDS: ${OCI_READ_TIMEOUT_SECONDS:-45}
      OCI_MAX_SERVICE_WORKERS: ${OCI_MAX_SERVICE_WORKERS:-6}
      OCI_MAX_LIMIT_WORKERS: ${OCI_MAX_LIMIT_WORKERS:-10}
      OCI_MAX_REGION_WORKERS: ${OCI_MAX_REGION_WORKERS:-2}
      OCI_GLOBAL_MAX_CONCURRENT_REQUESTS: ${OCI_GLOBAL_MAX_CONCURRENT_REQUESTS:-12}
      OCI_DB_COMMIT_BATCH_SIZE: ${OCI_DB_COMMIT_BATCH_SIZE:-25}
      OCI_REGION_STAGGER_SECONDS: ${OCI_REGION_STAGGER_SECONDS:-15}
      OCI_REGION_SCAN_MAX_ATTEMPTS: ${OCI_REGION_SCAN_MAX_ATTEMPTS:-3}
      OCI_REGION_RETRY_BASE_SECONDS: ${OCI_REGION_RETRY_BASE_SECONDS:-30}
      OCI_REGION_RETRY_MAX_SECONDS: ${OCI_REGION_RETRY_MAX_SECONDS:-300}
      LIP_ENABLE_NOTIFICATIONS: ${LIP_ENABLE_NOTIFICATIONS:-false}
      LIP_NOTIFICATION_EMAILS: ${LIP_NOTIFICATION_EMAILS:-["grant.frost@oracle.com"]}
      LIP_SCAN_INTERVAL_MINUTES: ${LIP_SCAN_INTERVAL_MINUTES:-240}
      LIP_PROMETHEUS_OTLP_ENDPOINT: ${LIP_PROMETHEUS_OTLP_ENDPOINT:-http://prometheus:9090/api/v1/otlp/v1/metrics}
      LIP_METRICS_PUBLISH_MAX_ATTEMPTS: ${LIP_METRICS_PUBLISH_MAX_ATTEMPTS:-3}
      LIP_METRICS_PUBLISH_TIMEOUT_SECONDS: ${LIP_METRICS_PUBLISH_TIMEOUT_SECONDS:-30}
      UPLOAD_DIR: /var/lib/oci-lip/uploads
    volumes:
      - uploads:/var/lib/oci-lip/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=3)
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
  worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.worker"]
    init: true
    restart: unless-stopped
    stop_grace_period: 5m
    logging: *default-logging
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      OCI_AUTH_MODE: ${OCI_AUTH_MODE:-instance_principal}
      OCI_TENANCY_OCID: ${OCI_TENANCY_OCID:-ocid1.tenancy.oc1..aaaaaaaa5trur7whdyytam4nmh3tinrx2yfqnbss6yzz4q6i7gmm2leagnkq}
      OCI_DEFAULT_REGION: ${OCI_DEFAULT_REGION:-us-ashburn-1}
      OCI_SCAN_ALL_REGIONS: ${OCI_SCAN_ALL_REGIONS:-false}
      OCI_CONNECT_TIMEOUT_SECONDS: ${OCI_CONNECT_TIMEOUT_SECONDS:-10}
      OCI_READ_TIMEOUT_SECONDS: ${OCI_READ_TIMEOUT_SECONDS:-45}
      OCI_MAX_SERVICE_WORKERS: ${OCI_MAX_SERVICE_WORKERS:-6}
      OCI_MAX_LIMIT_WORKERS: ${OCI_MAX_LIMIT_WORKERS:-10}
      OCI_MAX_REGION_WORKERS: ${OCI_MAX_REGION_WORKERS:-2}
      OCI_GLOBAL_MAX_CONCURRENT_REQUESTS: ${OCI_GLOBAL_MAX_CONCURRENT_REQUESTS:-12}
      OCI_DB_COMMIT_BATCH_SIZE: ${OCI_DB_COMMIT_BATCH_SIZE:-25}
      OCI_REGION_STAGGER_SECONDS: ${OCI_REGION_STAGGER_SECONDS:-15}
      OCI_REGION_SCAN_MAX_ATTEMPTS: ${OCI_REGION_SCAN_MAX_ATTEMPTS:-3}
      OCI_REGION_RETRY_BASE_SECONDS: ${OCI_REGION_RETRY_BASE_SECONDS:-30}
      OCI_REGION_RETRY_MAX_SECONDS: ${OCI_REGION_RETRY_MAX_SECONDS:-300}
      LIP_SCAN_INTERVAL_MINUTES: ${LIP_SCAN_INTERVAL_MINUTES:-240}
      LIP_WORKER_POLL_SECONDS: ${LIP_WORKER_POLL_SECONDS:-2}
      LIP_PROMETHEUS_OTLP_ENDPOINT: ${LIP_PROMETHEUS_OTLP_ENDPOINT:-http://prometheus:9090/api/v1/otlp/v1/metrics}
      LIP_METRICS_PUBLISH_MAX_ATTEMPTS: ${LIP_METRICS_PUBLISH_MAX_ATTEMPTS:-3}
      LIP_METRICS_PUBLISH_TIMEOUT_SECONDS: ${LIP_METRICS_PUBLISH_TIMEOUT_SECONDS:-30}
      LIP_ENABLE_NOTIFICATIONS: ${LIP_ENABLE_NOTIFICATIONS:-false}
      LIP_NOTIFICATION_EMAILS: ${LIP_NOTIFICATION_EMAILS:-["grant.frost@oracle.com"]}
      LIP_WORKER_HEARTBEAT_PATH: /tmp/oci-lip-worker-heartbeat
      UPLOAD_DIR: /var/lib/oci-lip/uploads
    volumes:
      - uploads:/var/lib/oci-lip/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker_health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 45s

  prometheus:
    image: prom/prometheus:v3.12.0
    restart: unless-stopped
    stop_grace_period: 1m
    logging: *default-logging
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --storage.tsdb.retention.size=5GB
      - --web.enable-lifecycle
      - --web.enable-otlp-receiver
      - --query.lookback-delta=30d
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9090/-/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  grafana:
    image: grafana/grafana-enterprise:13.0.2
    restart: unless-stopped
    stop_grace_period: 1m
    logging: *default-logging
    environment:
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost/grafana/}
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env}
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: X-WEBAUTH-USER
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_PROXY_HEADERS: "Email:X-WEBAUTH-EMAIL Name:X-WEBAUTH-NAME"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PLUGIN_ADMIN_ENABLED: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/oci-lip-overview.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  certbot:
    image: certbot/certbot:v5.6.0
    profiles: ["operations"]
    volumes:
      - acme-challenge:/var/www/acme
      - letsencrypt:/etc/letsencrypt

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *default-logging
    depends_on:
      api:
        condition: service_healthy
      grafana:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - acme-challenge:/var/www/acme:ro
    ports:
      - "80:80"

volumes:
  postgres-data:
  uploads:
  prometheus-data:
  grafana-data:
  acme-challenge:
  letsencrypt:

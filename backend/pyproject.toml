[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oci-lip-backend"
version = "0.1.0"
description = "Backend for OCI Limit Intelligence Platform"
requires-python = ">=3.11,<3.15"
dependencies = [
  "alembic>=1.13",
  "authlib>=1.4,<2",
  "cryptography>=44,<47",
  "fastapi>=0.115",
  "httpx>=0.28,<1",
  "itsdangerous>=2.2,<3",
  "oci>=2.150,<3",
  "opentelemetry-proto>=1.30,<2",
  "openpyxl>=3.1",
  "pydantic-settings>=2.6",
  "psycopg[binary]>=3.2",
  "prometheus-client>=0.21",
  "protobuf>=5,<7",
  "pypdf>=5.0",
  "python-docx>=1.1",
  "python-multipart>=0.0.12",
  "sqlalchemy>=2.0",
  "uvicorn[standard]>=0.30"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.8"
]

[project.scripts]
oci-bill-compare = "app.tools.bill_compare_tool:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["app/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

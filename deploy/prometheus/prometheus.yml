global:
  scrape_interval: 5m
  evaluation_interval: 5m
  external_labels:
    platform: oci-lip
    tenancy: grantf

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: oci-lip-api
    metrics_path: /metrics
    scheme: http
    static_configs:
      - targets:
          - api:8000
        labels:
          environment: production

groups:
  - name: oci-lip-capacity
    interval: 5m
    rules:
      - alert: OciLipLimitCritical
        expr: (oci_lip_limit_usage_percent{environment="production",job="oci-lip-api",instance="api:8000"} >= on() group_left oci_lip_critical_threshold_percent{environment="production",job="oci-lip-api",instance="api:8000"}) unless on(region,service,limit_name,scope,availability_domain) (oci_lip_limit_muted{environment="production",job="oci-lip-api",instance="api:8000"} == 1)
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "OCI limit at critical utilization"
          description: "{{ $labels.service }}/{{ $labels.limit_name }} in {{ $labels.region }} is {{ $value | printf \"%.1f\" }}% used."

      - alert: OciLipLimitWarning
        expr: ((oci_lip_limit_usage_percent{environment="production",job="oci-lip-api",instance="api:8000"} >= on() group_left oci_lip_warning_threshold_percent{environment="production",job="oci-lip-api",instance="api:8000"}) and (oci_lip_limit_usage_percent{environment="production",job="oci-lip-api",instance="api:8000"} < on() group_left oci_lip_critical_threshold_percent{environment="production",job="oci-lip-api",instance="api:8000"})) unless on(region,service,limit_name,scope,availability_domain) (oci_lip_limit_muted{environment="production",job="oci-lip-api",instance="api:8000"} == 1)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "OCI limit approaching capacity"
          description: "{{ $labels.service }}/{{ $labels.limit_name }} in {{ $labels.region }} is {{ $value | printf \"%.1f\" }}% used."

      - alert: OciLipCollectionFailed
        expr: (oci_lip_limit_collection_status{environment="production",job="oci-lip-api",instance="api:8000",status="failed"} == 1) unless on(region,service,limit_name,scope,availability_domain) (oci_lip_limit_muted{environment="production",job="oci-lip-api",instance="api:8000"} == 1)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "OCI limit collection is failing"
          description: "Collection failed for {{ $labels.service }}/{{ $labels.limit_name }} in {{ $labels.region }}."

      - alert: OciLipScanStale
        expr: (time() - oci_lip_scan_last_success_timestamp_seconds{environment="production",job="oci-lip-api",instance="api:8000"} > scalar(oci_lip_scan_schedule_interval_seconds{environment="production",job="oci-lip-api-health",instance="api:8000"}) + 900) and on() (oci_lip_scan_schedule_enabled{environment="production",job="oci-lip-api-health",instance="api:8000"} == 1)
        for: 15m
        labels:
          severity: critical
        annotations:
          summary: "OCI limit scan data is stale"
          description: "The last successful OCI limit scan in {{ $labels.region }} is later than its configured schedule plus the grace period."

      - alert: OciLipExporterDown
        expr: up{job="oci-lip-api-health"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "OCI LIP metrics exporter is unavailable"
          description: "Prometheus has been unable to scrape the OCI LIP API for five minutes."

      - alert: OciLipApiThrottling
        expr: oci_lip_scan_last_api_throttles{environment="production",job="oci-lip-api",instance="api:8000"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "OCI API throttling observed"
          description: "The latest {{ $labels.region }} scan observed {{ $value | printf \"%.0f\" }} OCI HTTP 429 responses."

      - alert: OciLipTlsCertificateExpiring
        expr: oci_lip_tls_certificate_days_remaining{environment="production",job="oci-lip-api-health",instance="api:8000"} < 2
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "OCI LIP TLS certificate expires within 48 hours"
          description: "The public IP certificate has {{ $value | printf \"%.2f\" }} days remaining."

      - alert: OciLipTlsCertificatePublicationFailed
        expr: (oci_lip_tls_certificate_publish_failures_total{environment="production",job="oci-lip-api-health",instance="api:8000"} > 0) and on() (oci_lip_tls_certificate_publish_success{environment="production",job="oci-lip-api-health",instance="api:8000"} == 0)
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "OCI LIP TLS certificate publication failed"
          description: "The certificate renewer has recorded {{ $value | printf \"%.0f\" }} or more publication failures."

      - alert: OciLipTlsCertificateNotServed
        expr: (oci_lip_tls_certificate_endpoint_verified{environment="production",job="oci-lip-api-health",instance="api:8000"} == 0) and on() (oci_lip_tls_certificate_last_publish_success_timestamp_seconds{environment="production",job="oci-lip-api-health",instance="api:8000"} > 0)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "OCI load balancer certificate is not verified"
          description: "The load balancer has not been verified as serving the certificate most recently published by OCI LIP."

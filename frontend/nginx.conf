map "$http_x_forwarded_proto:$request_uri" $lip_redirect_to_https {
  default 0;
  ~^http:(?!/\.well-known/acme-challenge/) 1;
}

server {
  listen 80;
  server_name _;
  absolute_redirect off;

  root /usr/share/nginx/html;
  index index.html;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  if ($lip_redirect_to_https) {
    return 301 https://$host$request_uri;
  }

  location = /_auth_verify {
    internal;
    proxy_pass http://api:8000/api/auth/verify;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Original-URI $request_uri;
  }

  location /api/ {
    proxy_pass http://api:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  }

  location /healthz {
    proxy_pass http://api:8000/healthz;
  }

  location /readyz {
    proxy_pass http://api:8000/readyz;
  }

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/acme;
    default_type text/plain;
    try_files $uri =404;
  }

  location = /grafana {
    return 301 /grafana/;
  }

  location /grafana/ {
    auth_request /_auth_verify;
    error_page 401 = @oidc_login;
    auth_request_set $auth_email $upstream_http_x_auth_email;
    auth_request_set $auth_name $upstream_http_x_auth_name;

    proxy_pass http://grafana:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Prefix /grafana;
    proxy_set_header X-WEBAUTH-USER $auth_email;
    proxy_set_header X-WEBAUTH-EMAIL $auth_email;
    proxy_set_header X-WEBAUTH-NAME $auth_name;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  location @oidc_login {
    return 302 /api/auth/login?next=$request_uri;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
